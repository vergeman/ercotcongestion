name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=.:compute pytest api ercot_ingest compute
        env:
          ERCOT_USERNAME: ci
          ERCOT_PASSWORD: ci
          ERCOT_SUBSCRIPTION_KEY: ci
          PROXY_BASE: https://example.invalid
          WRANGLER_PROXY_SECRET: ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
