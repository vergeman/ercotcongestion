services:
  app:
    build: ./app
    image: shifty
    container_name: app
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./data:/data
    command: python
  api:
    build: ./app
    image: shifty
    container_name: api
    env_file:
      - .env
    working_dir: /api
    depends_on:
      - app
    ports:
      - "8000:8000"
    volumes:
      - ./api:/api
      - ./data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000
 
