# Daily forecast PREVIEW tick (horizon 2, t+2): the second daily fit of the same
# model (0123). Where the 17:00 UTC final tick (forecast_cronjob.yml) forecasts
# T+1 two hours AFTER T+1's DAM has already closed — verification-only, never
# actionable — this tick forecasts T+2 right after T+1's DAM publishes (~13:30 CT),
# so it lands inside T+2's decision window with ~20h of lead before T+2's DAM
# closes.
#
# Same model version (--run-id unchanged — it scopes MODEL VERSION only, spec §4);
# --horizon 2 is what differs. The preview persists side by side with the final:
#   * horizon 1 rows (the noon final) and horizon 2 rows (this preview) coexist per
#     (run_id, delivery_date) — the final NEVER overwrites the preview, so
#     `final − preview` is a preserved audit trail of overnight covariate-vintage
#     revisions on an otherwise identical model.
#   * The API coalesces per day (prefer final, fall back to preview) into one
#     continuous series; each horizon grades as its own scoreboard track.
#
# Fail-loud gate (daily_forecast, horizon 2 only): this tick fires the same
# afternoon T+1's DAM is due, so a late ERCOT post would let the fit run with its
# freshest history day (D-1 = T+1) silently missing. The job asserts D-1's DAM has
# published BEFORE the fit and fails loud (nothing written, prior rows intact) if
# not — so a late post is a no-op this slot, not a degraded preview.
#
# Sequencing: the final tick fires 17:00 UTC and the preview 20:15 UTC — a 3h15m
# gap, far more than the 30-min hard deadline (activeDeadlineSeconds), so the two
# fits never overlap on the node (each peaks ~16Gi; they must not sum).
#
# Hand-run / backfill a single preview day on the identical path — same as the
# final backfill (see forecast_cronjob.yml), only add `--horizon 2`:
#   ... python -m compute.jobs.daily_forecast \
#          --delivery-date 2026-05-01 --run-id mu-all-v1 --horizon 2 --to-db
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ercot-forecast-preview
  namespace: ercotstress
spec:
  # Daily at 20:15 UTC. Cron runs in UTC, fixed year-round, so the CT time shifts:
  #   CDT (summer, UTC-5): 20:15 UTC = 15:15 CDT
  #   CST (winter, UTC-6): 20:15 UTC = 14:15 CST
  # Both land after 14:00 CT — when the daily-settled ingest fetches T+1's DAM by
  # name (0127) — so the horizon-2 gate, which now requires T+1's DAM to span its
  # window (not just have a row), sees it in both seasons. Still 3h+ clear of the
  # 17:00 UTC final tick so the two ~16Gi fits never contend for memory.
  schedule: "15 20 * * *"

  # If a previous preview run is still going, skip this slot. A refit + fit +
  # propagate should never overlap itself.
  concurrencyPolicy: Forbid

  # Runs late if the cluster was offline; only catches up the most recent missed
  # run. 5 min grace for a missed schedule.
  startingDeadlineSeconds: 300

  # Keep enough history to debug. Trim to avoid ETCD bloat.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

  jobTemplate:
    spec:
      # No retry within a scheduled run — the next daily preview tick is the retry,
      # and the run is re-runnable by hand. A starved run (D-1 DAM not yet posted)
      # fails loud on the gate and must NOT thrash.
      backoffLimit: 0
      # Hard timeout: SF refit + fit + propagate. Generous vs the ingest job.
      activeDeadlineSeconds: 1800

      template:
        metadata:
          labels:
            app: ercot-forecast-preview
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          containers:
            - name: forecast-preview
              # Same consolidated image as api / ingest / the final tick.
              image: ${IMAGE_REPO}/ercotstress/api-compute:${IMAGE_TAG}
              # imagePullPolicy: Always
              command:
                - python
                - -m
                - compute.jobs.daily_forecast
                - --delivery-date
                - tomorrow
                - --run-id
                - mu-all-v1
                - --horizon
                - "2"
                - --to-db
              env:
                # Keep RSS near the true working set on this shared node — same
                # tuning as the final tick (mirrors compute_shell_pod).
                - name: MALLOC_ARENA_MAX
                  value: "2"
                - name: MALLOC_TRIM_THRESHOLD_
                  value: "0"
                - name: MU_SPILL_PANEL
                  value: "1"
                - name: MU_SPILL_DIR
                  value: "/compute/runs/__spill__"
              envFrom:
                - configMapRef:
                    name: api-config
                - secretRef:
                    name: postgres-credentials
              resources:
                # Memory-heavy: the panel-slice fit peaks ~16Gi on prod (0013), the
                # same fit as the final tick (horizon is persistence/labeling only).
                requests:
                  cpu: "2"
                  memory: "5Gi"
                limits:
                  cpu: "6"
                  memory: "16Gi"
              # The mu residual pool (mu_preds.npz) is read per run_id from this PVC.
              # Read-only: the preview tick reads the pool and writes only to the DB
              # (no --npz-dir here).
              volumeMounts:
                - name: runs
                  mountPath: /compute/runs

          volumes:
            - name: runs
              persistentVolumeClaim:
                claimName: compute-runs
