# Backfill ingest data from ERCOT for 2025-01-01 → 2026-05-07.
#
# Usage:
#   export IMAGE_REPO=12345.dkr.ecr.us-east-1.amazonaws.com
#   envsubst < ops/deploy/jobs/backfill_ingest_job.yml | kubectl apply -f -
#
#   kubectl -n ercotstress logs -f job/backfill-ingest
#
# This script is idempotent. --resume reads ingest_log and skips any
# (endpoint, day) pairs that already succeeded, so re-running fills only the
# gaps. Adjust --start / --end below to bound a different window.
#
# Expected runtime: hours. ERCOT API is rate-limited; ~493 days × 10 endpoints
# in the worst case (zonal_lmp, outages, loads, wind, solar, dam_spp,
# dam_shadow, dam_lambda, sced_lambda, load_forecast). Resume mode means
# most calls will be skipped if your DB already has data.
#
# After it finishes:
#   kubectl -n ercotstress delete job backfill-ingest

apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-ingest
  namespace: ercotstress
  labels:
    app: ercot-ingest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400          # 24h hard cap; bump if needed
  template:
    metadata:
      labels:
        app: ercot-ingest
        job: backfill-ingest
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: backfill
          image: ${IMAGE_REPO}/ercotstress/api-compute:${IMAGE_TAG}
          imagePullPolicy: Always
          command:
            - python
            #- /ercot_ingest/backfill.py
            - /ercot_ingest/backfill_dam_close.py
            - --start
            - "2024-12-10"
            - --end
            - "2025-05-02"
            - --resume
            #- --endpoint
            #- "dam_lambda"
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: ercot-ingest-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
