# Backfill ingest data from ERCOT over the window set in `args` below.
#
# Runs two drivers in sequence:
#   backfill.py            — whole-day windows for the public-report endpoints
#                            (zonal_lmp, outages, loads, wind, solar, dam_spp,
#                            dam_shadow, dam_lambda, sced_lambda).
#   backfill_dam_close.py  — the single forecast vintage admissible at DAM close
#                            (load/wind/solar 7-day forecasts).
#
# Usage:
#   export IMAGE_REPO=12345.dkr.ecr.us-east-1.amazonaws.com
#   envsubst < ops/deploy/jobs/backfill_ingest_job.yml | kubectl apply -f -
#
#   kubectl -n ercotstress logs -f job/backfill-ingest
#
# Both drivers are idempotent. --resume reads ingest_log and skips windows that
# already succeeded, so re-running fills only the gaps. Adjust the --start /
# --end in `args` below to bound a different window.
#
# Expected runtime: hours on a cold DB. ERCOT API is rate-limited; resume mode
# means most calls are skipped if your DB already has data.
#
# After it finishes:
#   kubectl -n ercotstress delete job backfill-ingest

apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-ingest
  namespace: ercotstress
  labels:
    app: ercot-ingest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400          # 24h hard cap; bump if needed
  template:
    metadata:
      labels:
        app: ercot-ingest
        job: backfill-ingest
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: backfill
          image: ${IMAGE_REPO}/ercotstress/api-compute:${IMAGE_TAG}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          # Two ingest models, one Job. backfill.py pulls whole-day windows for the
          # public-report endpoints; backfill_dam_close.py pulls the single forecast
          # vintage admissible at DAM close. Both are idempotent (--resume reads
          # ingest_log), so a mid-run failure re-runs cheaply. `&&` so the second
          # stage is skipped if the first errors out hard.
          args:
            - |
              python /ercot_ingest/backfill.py           --start 2024-05-01 --end 2026-07-20 --resume &&
              python /ercot_ingest/backfill_dam_close.py --start 2024-05-01 --end 2026-07-20 --resume
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: ercot-ingest-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
